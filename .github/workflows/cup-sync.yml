name: IFSL cup sync

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write             # lets the job commit cup-data.json back to the repo

concurrency:
  group: cup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape the 19 leagues (cup)
        run: python cup_scrape.py

      # the steps below run even if the cup step failed, so one broken scraper doesn't stop the other
      - name: Scrape the draft results (drafts page)
        if: ${{ !cancelled() }}
        run: python drafts_scrape.py

      - name: Keep pages the cup scraper couldn't read (for debugging)
        if: ${{ !cancelled() && hashFiles('debug/*.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unreadable-pages
          path: debug/
          retention-days: 7

      - name: Save the data files
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cup-data.json drafts-data.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

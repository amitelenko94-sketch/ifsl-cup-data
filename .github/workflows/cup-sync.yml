name: IFSL cup sync

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write             # lets the job commit cup-data.json back to the repo

concurrency:
  group: cup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape the 19 leagues
        run: python cup_scrape.py

      - name: Save cup-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cup-data.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update cup data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

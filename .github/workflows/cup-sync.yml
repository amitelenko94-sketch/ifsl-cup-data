name: IFSL cup sync

on:
  schedule:
    # ask every 30 minutes: GitHub drops many scheduled runs (since 2026-11-16 only a few a day fire), so we ask
    # often and the "fresh enough?" step below skips a run when the data was updated less than 75 minutes ago
    - cron: "7,37 * * * *"
  workflow_dispatch:          # "Run workflow" button in the Actions tab — also used by a run to start its follow-up
  push:                       # run right away when the scraper code changes (the bot's data commits don't trigger runs)
    branches: [main]
    paths: ["*.py", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write             # commit the data files back to the repo
  actions: write              # start a follow-up run (see sync_loop.py)

concurrency:
  group: cup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # a night run waits for the games to end (sync_loop.py hands over before this)
    steps:
      - uses: actions/checkout@v5

      # Scheduled runs only: skip when the data is still fresh (updated < 75 min ago). This is about the AGE of the
      # data, never about the clock time — a late/delayed run always goes ahead once the data is old.
      - name: Fresh enough?
        id: gate
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          run = "true"
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              try:
                  upd = json.load(open("cup-data.json"))["updated"]
                  age = datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.strptime(upd, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
                  if age < datetime.timedelta(minutes=75):
                      run = "false"
                      print(f"data is {int(age.total_seconds() // 60)} min old — skipping this run", file=__import__("sys").stderr)
              except Exception as e:
                  print(f"could not read the data age ({e}) — running", file=__import__("sys").stderr)
          print(f"run={run}")
          EOF

      - uses: actions/setup-python@v6
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pip install -r requirements.txt

      # cup + drafts + trades, commit — and at night: wait until the games are over, then collect
      - name: Collect the data
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: python sync_loop.py

      - name: Keep pages the cup scraper couldn't read (for debugging)
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && hashFiles('debug/*.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unreadable-pages
          path: debug/
          retention-days: 7

      # the night wait ran out of time — start a follow-up run that carries on (not dependent on GitHub's schedule)
      - name: Start a follow-up run
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && hashFiles('continue.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cup-sync.yml --ref main --repo "$GITHUB_REPOSITORY"
